services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    test.representation_serializer:
        alias: Lingoda\SentryBundle\Sentry\RepresentationSerializer
        public: true

    Lingoda\SentryBundle\Tests\Sentry\TestHandler:
        decorates: Lingoda\SentryBundle\Sentry\Handler
    Lingoda\SentryBundle\Tests\Controller\TestController:
        tags: ['controller.service_arguments']

    # Spy `before_send` used by HandlerFingerprintTest to capture the events
    # (with their applied fingerprints) Sentry would otherwise send.
    Lingoda\SentryBundle\Tests\Sentry\RecordingBeforeSend: ~
