services:
    _defaults:
        autowire: true
        autoconfigure: true

    Lingoda\SentryBundle\:
        resource: '../../*'
        # The user context listener is registered by the extension, only when a resolver is configured.
        exclude: '../../{Resources,EventListener}'

    Sentry\Monolog\Handler:
        arguments:
            $hub: '@Sentry\State\HubInterface'
            $bubble: false

    Lingoda\SentryBundle\Sentry\RepresentationSerializer:
        arguments:
            $options: '@sentry.client.options'

    Lingoda\SentryBundle\Sentry\Serializer\NamespaceJsonSerializer: ~

    # Default before_send scrubber. Override by either decorating this service
    # or by setting lingoda_sentry.before_send to your own service id.
    Lingoda\SentryBundle\Sentry\SensitiveDataScrubber:
        arguments:
            $queryParamNames: '%lingoda_sentry.scrubber.query_param_names%'
            $valuePatterns: '%lingoda_sentry.scrubber.value_patterns%'
            $sendIp: '%lingoda_sentry.send_ip%'

    Monolog\Processor\PsrLogMessageProcessor:
        tags: { name: monolog.processor, handler: sentry }

    Lingoda\SentryBundle\Sentry\LogReleaseProcessor:
        tags: { name: monolog.processor, handler: sentry }

    # On every logger, not on a handler: it must run at log time, while the request still exists.
    Lingoda\SentryBundle\Sentry\RequestContextProcessor:
        tags: { name: monolog.processor }
